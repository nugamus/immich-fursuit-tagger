# NVIDIA GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Needs the NVIDIA Container Toolkit on the host.
services:
  tagger:
    image: ghcr.io/nugamus/immich-fursuit-tagger:cuda
    devices: !reset []
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
